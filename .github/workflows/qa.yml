name: QA

on:
  push:
    branches: [main, "codex/**", "release/**"]
  pull_request:
    branches: [main, "codex/**", "release/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests and coverage gate
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Mobile E2E, accessibility and performance smoke test
        run: pnpm test:e2e

      - name: Functional E2E game flow
        run: pnpm test:e2e:functional

      - name: V10 adaptive multiplication E2E
        run: pnpm test:e2e:v10

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/summary.json
          if-no-files-found: ignore
