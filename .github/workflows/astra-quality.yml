name: Astra quality
on:
  push:
    branches: ['versión_astra']
    paths: ['astra/**', '.github/workflows/astra-quality.yml']
  pull_request:
    paths: ['astra/**', '.github/workflows/astra-quality.yml']
permissions:
  contents: read
concurrency:
  group: astra-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: astra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
      - run: node tools/check.mjs
